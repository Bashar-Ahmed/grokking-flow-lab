[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "grokking-flow-lab"
version = "0.1.0"
description = "Minimal add/sub/mul modular-grokking and flow experiment lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "torch>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
hf = ["huggingface-hub>=0.30,<2"]

[project.scripts]
grokking-lab = "grokking_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grokking_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
