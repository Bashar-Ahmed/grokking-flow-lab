# Exact nine cells from the source study, expanded from three to five seeds.
# This file is a proposal, not authorization to run.
[experiment]
seeds = [0, 1, 2, 3, 4]

[[experiment.cells]]
operation = "add"
train_fraction = 0.25
weight_decay = 1.0

[[experiment.cells]]
operation = "add"
train_fraction = 0.30
weight_decay = 1.0

[[experiment.cells]]
operation = "add"
train_fraction = 0.40
weight_decay = 3.0

[[experiment.cells]]
operation = "sub"
train_fraction = 0.25
weight_decay = 1.0

[[experiment.cells]]
operation = "sub"
train_fraction = 0.30
weight_decay = 1.0

[[experiment.cells]]
operation = "sub"
train_fraction = 0.40
weight_decay = 3.0

[[experiment.cells]]
operation = "mul"
train_fraction = 0.30
weight_decay = 0.3

[[experiment.cells]]
operation = "mul"
train_fraction = 0.30
weight_decay = 1.0

[[experiment.cells]]
operation = "mul"
train_fraction = 0.40
weight_decay = 3.0

[model]
p = 113
d_model = 128
num_heads = 4
d_mlp = 512

[training]
epochs = 30000
learning_rate = 0.001
warmup_steps = 10
evaluation_batch_size = 4096

[checkpointing]
every = 100
include = [0, 1, 2, 5, 10, 20, 50]

[flow]
examples_per_split = 8
kinds = ["target_support", "target_oppose", "competitor_support", "competitor_oppose"]
